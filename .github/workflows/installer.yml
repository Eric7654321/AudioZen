name: installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'installer/**'
      - 'AudioUI/**'
      - 'AudioUI.Core/**'
      - 'AudioUI.Infra/**'
      - '.github/workflows/installer.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check and package installer
        shell: powershell
        run: ./installer/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AudioZen-Setup-win-x64
          path: artifacts/installer/AudioZen.Setup.exe
          if-no-files-found: error
