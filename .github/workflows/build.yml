name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 結果要寫回 ci-status 分支：本機沒有 GitHub token，只有 SSH，
# 所以讀取結果的唯一管道是 git ref 本身。
permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build AudioUI.sln -c Release --nologo 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test AudioUI.sln -c Release --no-build --nologo 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE

      - name: Write status
        if: always()
        shell: pwsh
        run: |
          # 只留錯誤清單與計數：完整 log 幾百行，而要判斷「能不能往下做」只需要這些。
          # MSBuild 同一則診斷會印兩次（inline 一次、結尾摘要一次），所以一律去重後再數。
          $errors = Select-String -Path build.log -Pattern ': error ' -ErrorAction SilentlyContinue |
                    ForEach-Object { $_.Line.Trim() } | Select-Object -Unique
          $warnLines = Select-String -Path build.log -Pattern ': warning ' -ErrorAction SilentlyContinue |
                       ForEach-Object { $_.Line.Trim() } | Select-Object -Unique
          $warnCount = $warnLines.Count

          # 依警告代碼分組：88 個警告逐條讀沒有意義，但「CS8618 有 40 個、CS4014 有 1 個」
          # 立刻看得出哪些是雜訊、哪些是孤例——孤例通常才是真的。
          $warnByCode = $warnLines |
            ForEach-Object { if ($_ -match 'warning (CS\d+|[A-Z]+\d+)') { $Matches[1] } } |
            Group-Object | Sort-Object Count -Descending |
            ForEach-Object { "$($_.Name) x$($_.Count)" }

          # 兩個獨立訊號：build step 的結果，以及 log 裡有沒有 error 行。
          # 只有一個訊號的話，判斷寫錯就會變成永遠的 PASS，而讀這份檔的人不會發現。
          $stepOk = '${{ steps.build.outcome }}' -eq 'success'
          $logOk  = $errors.Count -eq 0
          $buildResult = if ($stepOk -and $logOk) { 'PASS' } elseif (-not $stepOk -and -not $logOk) { 'FAIL' } else { 'INCONSISTENT' }

          # 測試沒跑（build 就掛了）與測試跑了但失敗，是兩件不同的事，別混成同一個字。
          $testOutcome = '${{ steps.test.outcome }}'
          $testSummary = if (Test-Path test.log) {
            (Select-String -Path test.log -Pattern 'Passed!|Failed!|error' | ForEach-Object { $_.Line.Trim() } |
             Select-Object -Unique -First 10) -join ' | '
          } else { '(未執行)' }
          $failedTests = if (Test-Path test.log) {
            Select-String -Path test.log -Pattern '^\s*(Failed|X)\s+\S' | ForEach-Object { $_.Line.Trim() } |
            Select-Object -Unique -First 20
          } else { @() }

          $result = if ($buildResult -ne 'PASS') { $buildResult }
                    elseif ($testOutcome -eq 'success') { 'PASS' }
                    else { 'TESTS_FAILED' }

          $lines = @(
            "commit: ${{ github.sha }}"
            "result: $result"
            "step_outcome: ${{ steps.build.outcome }}"
            "errors: $($errors.Count)"
            "warnings: $warnCount"
            "tests: $testOutcome"
            "test_summary: $testSummary"
            "finished: $(Get-Date -Format o)"
            ""
          )
          if ($errors.Count -gt 0) { $lines += '--- errors ---'; $lines += ($errors | Select-Object -First 40) }
          if ($failedTests.Count -gt 0) { $lines += '--- failed tests ---'; $lines += $failedTests }
          if ($warnByCode) { $lines += '--- warnings by code ---'; $lines += ($warnByCode -join ', ') }

          # 只出現一兩次的警告代碼全文列出：數量少代表它不是「整個 codebase 的通病」，
          # 而是某一處特別的事，值得逐條看。
          $rareCodes = $warnLines |
            ForEach-Object { if ($_ -match 'warning (CS\d+|[A-Z]+\d+)') { $Matches[1] } } |
            Group-Object | Where-Object { $_.Count -le 2 } | ForEach-Object { $_.Name }
          if ($rareCodes) {
            $lines += '--- rare warnings ---'
            $lines += ($warnLines | Where-Object { $l = $_; $rareCodes | Where-Object { $l -match "warning $_" } } |
                       Select-Object -First 20)
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $lines -join "`n" | Set-Content -Path out/status.md -Encoding utf8

      - name: Publish status to ci-status branch
        if: always()
        shell: bash
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # orphan 分支：狀態沒有歷史價值，每次覆蓋，不讓它把 repo 養胖。
          git checkout --orphan ci-status
          git rm -rf --cached . >/dev/null
          cp out/status.md ./status.md
          git add -f status.md
          git commit -q -m "ci: ${{ github.sha }}"
          git push -f origin ci-status

      - name: Fail the job if the build or the tests failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success'
        shell: bash
        run: exit 1
